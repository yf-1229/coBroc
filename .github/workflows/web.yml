name: Web Deploy (GitHub Pages)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14

      - name: Build WASM (Emscripten)
        working-directory: web
        run: |
          emcmake cmake -S . -B build-emscripten -DCMAKE_BUILD_TYPE=Release
          emmake cmake --build build-emscripten

      - name: Verify WASM artifacts
        working-directory: web
        run: |
          test -f public/coBrocWeb.js
          test -f public/coBrocWeb.wasm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Build frontend (Vite copies public/ into dist/)
        working-directory: web
        run: npm run build

      - name: Verify dist contains WASM artifacts
        working-directory: web
        run: |
          test -f dist/coBrocWeb.js
          test -f dist/coBrocWeb.wasm

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
